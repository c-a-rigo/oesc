<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1930" />
    <meta
      name="description"
      content="Explore as áreas, a rede e o planejamento do Observatório da Economia Espacial Catarinense."
    />
    <title>OESC · Painel do Observatório</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="modern.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Ir para o conteúdo</a>
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <a href="#overview" class="brand"
        ><span class="brand-symbol" aria-hidden="true">◉</span
        ><span
          >OESC<span class="brand-sub">OBSERVATÓRIO ESPACIAL</span></span
        ></a
      >
      <div class="workspace">
        <span class="workspace-icon" data-icon="orbit"></span>
        <div></div>
        <span class="status-dot"></span>
      </div>
      <p class="nav-label">EXPLORAR</p>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="network-prompt">
          <span data-icon="network"></span><strong></strong>
          <p></p>
          <a
            href="https://oesc.ufsc.br/participar.html"
            target="_blank"
            rel="noopener"
            ><span data-icon="arrowUpRight"></span
          ></a>
        </div>
        <a
          class="institution"
          href="https://oesc.ufsc.br/"
          target="_blank"
          rel="noopener"
          ><span class="institution-mark"></span><span><small></small></span
          ><span data-icon="arrowUpRight"></span
        ></a>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button"
            id="menu-toggle"
            aria-label="Alternar menu"
            aria-expanded="true"
            aria-controls="sidebar"
          >
            <span data-icon="panel"></span></button
          ><span>Observatório</span><span class="crumb-separator">/</span
          ><strong id="breadcrumb-title">Visão geral</strong>
        </div>
        <div class="topbar-actions">
          <button
            class="search-button"
            id="open-search"
            aria-label="Buscar no observatório"
          >
            <span data-icon="search"></span><span>Buscar no observatório</span
            ><kbd>⌘ K</kbd></button
          ><a
            class="official-link"
            href="https://oesc.ufsc.br/"
            target="_blank"
            rel="noopener"
            >Site institucional <span data-icon="arrowUpRight"></span></a
          ><span class="avatar" title="Painel público">SC</span>
        </div>
      </header>
      <main id="main" tabindex="-1" aria-busy="true">
        <p role="status">Carregando o observatório…</p>
        <noscript
          >Ative o JavaScript para carregar os conteúdos do
          observatório.</noscript
        >
      </main>
      <footer>
        <span>OESC <span class="footer-dot">·</span> </span
        ><a href="https://oesc.ufsc.br/" target="_blank" rel="noopener"
          >Fonte: OESC / UFSC <span data-icon="arrowUpRight"></span
        ></a>
      </footer>
    </div>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <div class="dialog-heading">
        <h2 id="search-title">Buscar no observatório</h2>
        <button class="icon-button" id="close-search" aria-label="Fechar busca">
          <span data-icon="close"></span>
        </button>
      </div>
      <label class="search-field"
        ><span data-icon="search"></span
        ><input
          id="global-search"
          type="search"
          placeholder="Áreas, entregas, oportunidades…"
          autocomplete="off"
          aria-label="Buscar seções e conteúdo"
      /></label>
      <div id="search-results" aria-live="polite"></div>
      <p class="search-hint">Explore os conteúdos publicados pelo OESC.</p>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
